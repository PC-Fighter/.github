      <stop offset="0" stop-color="#0f3b4c"/>
      <stop offset="1" stop-color="#0a2633"/>
    </linearGradient>
    <path id="arriba" d="M 34 100 A 66 66 0 0 1 166 100"/>
    <path id="abajo" d="M 30 100 A 70 70 0 0 0 170 100"/>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#g)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#f2b632" stroke-width="3"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="#f2b632" stroke-width="1.5" opacity=".6"/>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#ffffff">
    <textPath href="#arriba" startOffset="50%" text-anchor="middle">SERVICIO</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#ffffff">
