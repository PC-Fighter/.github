  </text>
  <circle cx="35" cy="100" r="3" fill="#f2b632"/>
  <circle cx="165" cy="100" r="3" fill="#f2b632"/>
  <!-- monitor -->
  <rect x="72" y="76" width="56" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M 92 114 L 89 124 M 108 114 L 111 124 M 84 125 L 116 125" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- llave -->
  <mask id="boca">
